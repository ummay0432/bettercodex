[package]
name = "bettercodex"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "A deliberately focused OpenAI Codex coding-agent harness"
repository = "https://github.com/ummay0432/bettercodex"
readme = "README.md"
default-run = "bcodex"

[[bin]]
name = "bcodex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
ansi-to-tui = { version = "8", default-features = false }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22.1"
bytes = "1"
chrono = { version = "0.4.43", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.15"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ignore = "0.4.23"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
include_dir = "0.7.4"
iana-time-zone = "0.1.64"
libc = "0.2"
lru = "0.18.2"
memchr = "2"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }
percent-encoding = "2.3"
pulldown-cmark = { version = "0.10", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }
regex = { version = "1", default-features = false, features = ["perf", "std", "unicode"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls-webpki-roots-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
sha1 = "0.10.6"
shlex = "2"
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tiny_http = "0.12"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
tracing = { version = "0.1", default-features = false, features = ["log", "std"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", default-features = false, features = ["deflate", "handshake"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", default-features = false, features = ["std", "v4", "v5"] }
webbrowser = "1.0"
which = "8"
zstd = { version = "0.13", default-features = false }
diffy = "0.4.2"

[profile.dev]
# Keep line tables/backtraces while avoiding expensive full variable debug info
# across local builds and tests.
debug = "limited"

[profile.release]
lto = "thin"
strip = true
# Match upstream's balance between parallel release code generation, runtime
# performance, and binary size.
codegen-units = 4

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["test-util"] }
vt100 = "0.16.2"
