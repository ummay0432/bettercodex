name: release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full public main commit to release
        required: true
        type: string

concurrency:
  group: bettercodex-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release revision
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - id: release
        name: Validate version, revision, and release freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "revision must be a full lowercase commit ID" >&2
            exit 1
          }
          revision="$(git rev-parse HEAD)"
          [[ "$revision" == "$REQUESTED_REVISION" ]] || {
            echo "checkout resolved to $revision, not $REQUESTED_REVISION" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$revision" origin/main || {
            echo "$revision is not present on public main" >&2
            exit 1
          }
          version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml | head -1)"
          [[ -n "$version" ]] || {
            echo "Cargo.toml must contain a plain major.minor.patch package version" >&2
            exit 1
          }
          tag="bcodex-v${version}-${revision}"

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "$latest_tag" =~ ^bcodex-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9a-f]{40}$ ]] || {
            echo "latest release tag has an unsupported format: $latest_tag" >&2
            exit 1
          }
          latest_version="${BASH_REMATCH[1]}"
          newest="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -1)"
          [[ "$version" != "$latest_version" && "$newest" == "$version" ]] || {
            echo "release version $version must be newer than $latest_version" >&2
            exit 1
          }

          existing_release_tags="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name | startswith(\"bcodex-v${version}-\")) | .tag_name"
          )"
          [[ -z "$existing_release_tags" ]] || {
            printf 'release version %s already has a draft or release:\n%s\n' \
              "$version" "$existing_release_tags" >&2
            exit 1
          }
          existing_version_tags="$(git ls-remote --tags origin "refs/tags/bcodex-v${version}-*")"
          [[ -z "$existing_version_tags" ]] || {
            printf 'release version %s already has a tag:\n%s\n' \
              "$version" "$existing_version_tags" >&2
            exit 1
          }

          echo "revision=$revision" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  linux:
    name: Build Linux x86-64
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Test Unix installer
        run: python3 scripts/install_tests.py

      - name: Test bettercodex
        run: ./scripts/cargo-with-v8.sh test --locked --bin bcodex

      - name: Build and verify release binary
        shell: bash
        env:
          BCODEX_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/cargo-with-v8.sh build --release --locked --target x86_64-unknown-linux-gnu --bin bcodex
          binary="target/x86_64-unknown-linux-gnu/release/bcodex"
          [[ "$("$binary" --version)" == "bcodex $EXPECTED_VERSION" ]]
          [[ "$("$binary" --internal-release-tag)" == "$EXPECTED_TAG" ]]
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          BCODEX_HOME="$smoke_root/bcodex" CODEX_HOME="$smoke_root/codex" \
            "$binary" --internal-install-smoke
          mkdir -p dist
          gzip -9 -n -c "$binary" >dist/bcodex-x86_64-unknown-linux-gnu.gz

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-release
          path: dist/bcodex-x86_64-unknown-linux-gnu.gz
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS Apple silicon
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Test Unix installer
        run: python3 scripts/install_tests.py

      - name: Test bettercodex
        run: ./scripts/cargo-with-v8.sh test --locked --bin bcodex

      - name: Build, sign, and verify release binary
        shell: bash
        env:
          BCODEX_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == aarch64-apple-darwin ]]
          ./scripts/cargo-with-v8.sh build --release --locked --target aarch64-apple-darwin --bin bcodex
          binary="target/aarch64-apple-darwin/release/bcodex"
          codesign --force --sign - "$binary"
          codesign --verify --strict "$binary"
          [[ "$("$binary" --version)" == "bcodex $EXPECTED_VERSION" ]]
          [[ "$("$binary" --internal-release-tag)" == "$EXPECTED_TAG" ]]
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          BCODEX_HOME="$smoke_root/bcodex" CODEX_HOME="$smoke_root/codex" \
            "$binary" --internal-install-smoke
          mkdir -p dist
          gzip -9 -n -c "$binary" >dist/bcodex-aarch64-apple-darwin.gz

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-release
          path: dist/bcodex-aarch64-apple-darwin.gz
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows x86-64
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Test PowerShell installer
        shell: powershell
        run: .\scripts\install_windows_tests.ps1

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Test bettercodex
        shell: powershell
        env:
          RUST_MIN_STACK: "8388608"
        run: .\scripts\cargo-with-v8.ps1 nextest run --locked --no-fail-fast --bin bcodex

      - name: Build and verify release binary
        shell: powershell
        env:
          BCODEX_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          .\scripts\cargo-with-v8.ps1 build --release --locked --target x86_64-pc-windows-msvc --bin bcodex
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
          $binary = 'target\x86_64-pc-windows-msvc\release\bcodex.exe'
          if ((& $binary --version) -cne "bcodex $env:EXPECTED_VERSION") { throw 'version check failed' }
          if ((& $binary --internal-release-tag) -cne $env:EXPECTED_TAG) { throw 'release tag check failed' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('bettercodex-smoke.' + [Guid]::NewGuid().ToString('N'))
          try {
            $env:BCODEX_HOME = Join-Path $smokeRoot 'bcodex'
            $env:CODEX_HOME = Join-Path $smokeRoot 'codex'
            & $binary --internal-install-smoke
            if ($LASTEXITCODE -ne 0) { throw 'release smoke test failed' }
          } finally {
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sourceStream = [IO.File]::OpenRead((Resolve-Path $binary))
          $archiveStream = [IO.File]::Create((Join-Path (Resolve-Path dist) 'bcodex-x86_64-pc-windows-msvc.exe.gz'))
          $gzipStream = New-Object IO.Compression.GZipStream($archiveStream, [IO.Compression.CompressionMode]::Compress)
          try { $sourceStream.CopyTo($gzipStream) } finally { $gzipStream.Dispose(); $archiveStream.Dispose(); $sourceStream.Dispose() }

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-release
          path: dist/bcodex-x86_64-pc-windows-msvc.exe.gz
          if-no-files-found: error
          retention-days: 1

  linux-qualification:
    name: Qualify Linux binary on Ubuntu and Debian
    needs: [prepare, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: dist

      - name: Test on Ubuntu 22.04 and Debian 12
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gzip -dc dist/bcodex-x86_64-unknown-linux-gnu.gz >dist/bcodex
          chmod 755 dist/bcodex
          [[ "$(dist/bcodex --internal-release-tag)" == "$EXPECTED_TAG" ]]
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          BCODEX_HOME="$smoke_root/bcodex" CODEX_HOME="$smoke_root/codex" \
            dist/bcodex --internal-install-smoke
          docker run --rm \
            -v "$PWD/dist:/release:ro" \
            -e BCODEX_HOME=/tmp/bcodex \
            -e CODEX_HOME=/tmp/codex \
            debian:12-slim \
            /release/bcodex --internal-install-smoke

  draft-release:
    name: Create draft GitHub release
    needs: [prepare, linux, macos, windows, linux-qualification]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: Verify and create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          expected=(
            bcodex-aarch64-apple-darwin.gz
            bcodex-x86_64-pc-windows-msvc.exe.gz
            bcodex-x86_64-unknown-linux-gnu.gz
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${expected_sorted[*]}" ]] || {
            printf 'unexpected release assets:\n%s\n' "${actual[*]}" >&2
            exit 1
          }
          for asset in "${expected[@]}"; do gzip -t "dist/$asset"; done

          notes="Source revision: \`$RELEASE_REVISION\`

          Prebuilt binaries:
          - Windows x86-64
          - macOS Apple silicon
          - Linux x86-64 (qualified on Ubuntu and Debian)"
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_REVISION" \
            --title "bettercodex $RELEASE_VERSION" \
            --notes "$notes" \
            --draft
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >>"$GITHUB_STEP_SUMMARY"
