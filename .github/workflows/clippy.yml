name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Reject emojis
        run: ./scripts/check-no-emoji.sh
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Check formatting
        run: ./scripts/dev.py cargo fmt --all -- --check
      - name: Test developer workflows
        run: python3 -m unittest -v scripts.check_no_emoji_tests scripts.dev_tests scripts.evaluate_harness_tests scripts.install_tests
      - name: Run test suite
        run: ./scripts/dev.py cargo test --locked
      - name: Run Clippy
        run: ./scripts/dev.py cargo clippy --locked --all-targets -- -D warnings
